<div class="view-header">
    <h1>Próximamente</h1>
    <p>Estamos trabajando para mejorar tu experiencia en GLauncher</p>
</div>

<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 50vh; text-align: center; gap: 25px;">
    <div class="card" style="padding: 50px; border-color: var(--primary); max-width: 550px; animation: fadeIn 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);">
        <div style="position: relative; display: inline-block; margin-bottom: 20px;">
            <i class="fa-solid fa-screwdriver-wrench fa-4x" style="color: var(--primary); filter: drop-shadow(0 0 15px var(--primary-glow));"></i>
            <i class="fa-solid fa-clock" style="position: absolute; bottom: -5px; right: -5px; font-size: 1.5rem; color: #f39c12; background: #0a0a0a; border-radius: 50%; padding: 2px;"></i>
        </div>
        
        <h2 style="font-family: 'Minecraftia'; color: #fff; margin-bottom: 15px; text-shadow: 2px 2px 0px rgba(0,0,0,0.5);">Apartado en Desarrollo</h2>
        
        <p style="color: #aaa; line-height: 1.6; font-family: 'Montserrat-Bold'; font-size: 0.95rem;">
            Esta sección está siendo pulida por nuestro equipo para asegurar que funcione perfectamente. 
            ¡Vuelve pronto para ver las novedades!
        </p>

        <div class="glass-hr" style="margin: 30px 0;"></div>
        
        <button class="btn btn-primary" onclick="loadView('inicio')">
            <i class="fa-solid fa-house"></i> VOLVER AL INICIO
        </button>
    </div>
</div>
