<!-- Este archivo sirve como referencia de la estructura de una notificación -->
<div class="notification success">
    <div class="notif-content">
        <span class="notif-label">Logrado</span>
        <span class="notif-message">¡Instancia cargada con éxito!</span>
    </div>
</div>

<div class="notification error">
    <div class="notif-content">
        <span class="notif-label">Error Crítico</span>
        <span class="notif-message">No se pudo conectar con el servidor de autenticación.</span>
    </div>
</div>

<div class="notification warning">
    <div class="notif-content">
        <span class="notif-label">Advertencia</span>
        <span class="notif-message">La versión seleccionada es inestable.</span>
    </div>
</div>
