<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="../../https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            -webkit-app-region: drag; /* Se puede arrastrar */
        }
        .mini-card {
            background: rgba(5, 5, 5, 0.95);
            border: 1px solid rgba(0, 120, 215, 0.5);
            border-radius: 15px;
            height: 98px; 
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-shadow: 0 0 25px rgba(0, 120, 215, 0.3);
            color: white;
            position: relative;
            backdrop-filter: blur(10px);
        }
        .info-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            margin-left: 12px;
        }
        .controls {
            position: absolute;
            top: 5px;
            right: 10px;
            -webkit-app-region: no-drag;
        }
        .close-btn {
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 14px;
            transition: color 0.2s;
        }
        .close-btn:hover { color: #ff4757; }
        #title {
            font-size: 0.8rem;
            font-weight: bold;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
        }
        .label-tag {
            font-size: 0.55rem;
            color: #0078d7;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
            font-weight: 800;
        }

        /* Estilos del Visualizador de Barras */
        .visualizer {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 35px;
            width: 45px;
            opacity: 0.8;
        }
        .bar {
            width: 4px;
            background: linear-gradient(to top, #005a9e, #00a4ef);
            border-radius: 2px 2px 0 0;
            height: 3px;
            transition: height 0.1s ease;
        }

        /* Animación que simula el ritmo */
        .playing .bar {
            animation: musicWave 0.6s infinite ease-in-out alternate;
        }

        @keyframes musicWave {
            0% { height: 3px; }
            100% { height: 30px; }
        }

        /* Delays aleatorios para las barras para simular realismo */
        .bar:nth-child(1) { animation-delay: 0.1s; animation-duration: 0.45s; }
        .bar:nth-child(2) { animation-delay: 0.3s; animation-duration: 0.7s; }
        .bar:nth-child(3) { animation-delay: 0.2s; animation-duration: 0.55s; }
        .bar:nth-child(4) { animation-delay: 0.4s; animation-duration: 0.65s; }
        .bar:nth-child(5) { animation-delay: 0.15s; animation-duration: 0.5s; }
    </style>
</head>
<body>
    <div class="mini-card">
        <div class="controls">
            <i class="fa-solid fa-xmark close-btn" onclick="window.close()"></i>
        </div>

        <div class="visualizer" id="viz">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        
        <div class="info-container">
            <span class="label-tag">GMusic Radio</span>
            <div id="title">Cargando...</div>
        </div>
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        const bars = document.querySelectorAll('.bar');
        let animationFrame;

        function animate() {
            if (document.getElementById('viz').classList.contains('playing')) {
                bars.forEach(bar => {
                    // Simulamos el ritmo con fluctuaciones aleatorias pero suaves
                    const targetHeight = Math.random() * 30 + 5;
                    bar.style.height = targetHeight + 'px';
                });
            }
            setTimeout(() => { animationFrame = requestAnimationFrame(animate); }, 100);
        }

        ipcRenderer.on('update-title', (event, title) => {
            document.getElementById('title').innerText = title;
            const viz = document.getElementById('viz');
            
            if (title && title !== "Nada en reproducción" && title !== "Cargando...") {
                viz.classList.add('playing');
                if (!animationFrame) animate();
            } else {
                viz.classList.remove('playing');
                bars.forEach(b => b.style.height = '3px');
            }
        });
    </script>
</body>
</html>
